<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>간단한 메모장</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="메모장">
<style>*{box-sizing:border-box}body{margin:0;background:white;color:#222;font:16px system-ui,sans-serif}main{max-width:600px;margin:32px auto;padding:16px}section,li{border:1px solid #ddd;border-radius:10px;padding:20px;margin:16px 0}h1{font-size:26px}input,textarea,button{font:inherit;min-height:44px;padding:12px;border:1px solid #bbb;border-radius:6px}input,textarea{display:block;width:100%;margin:8px 0 16px}textarea{min-height:120px;resize:vertical}button{background:#f5f5f5;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.actions{display:flex;gap:8px;flex-wrap:wrap}ul{padding:0;list-style:none}li p{white-space:pre-wrap;overflow-wrap:anywhere}#status{min-height:24px;overflow-wrap:anywhere}#account{overflow-wrap:anywhere}[hidden]{display:none!important}</style></head>
<body><main><h1>간단한 메모장</h1><p id="status" role="status" aria-live="polite">불러오는 중…</p>
<section id="auth" hidden><form id="authForm"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required><label for="password">비밀번호</label><input id="password" type="password" minlength="6" autocomplete="current-password" required><div class="actions"><button type="submit">로그인</button><button id="signup" type="button">회원가입</button></div></form></section>
<section id="memo" hidden><p id="account"></p><button id="logout">로그아웃</button><form id="memoForm"><label for="content">메모 내용</label><textarea id="content" required></textarea><button type="submit">저장</button></form><ul id="list"></ul></section></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm';
const db=createClient('https://moszrivdyldsognndoat.supabase.co','sb_publishable_UqexdQQ62-8boL145z7POA_5uM_9RPX');
const $=id=>document.getElementById(id);
let user=null, busy=false, generation=0;
function message(text){$('status').textContent=text}
function lock(value){busy=value;document.querySelectorAll('button').forEach(b=>b.disabled=value)}
async function run(task,label){if(busy)return;lock(true);message(label);try{await task()}catch(e){message('오류: '+(e.message||'다시 시도해 주세요.'))}finally{lock(false)}}
async function list(){
 const current=++generation, owner=user?.id;if(!owner)return;
 const {data,error}=await db.from('memos').select('id,content,created_at').eq('user_id',owner).order('created_at',{ascending:false});
 if(error)throw error;if(current!==generation||owner!==user?.id)return;
 $('list').replaceChildren();
 for(const row of data){const li=document.createElement('li'),p=document.createElement('p'),b=document.createElement('button');p.textContent=row.content;b.textContent='삭제';b.disabled=busy;b.onclick=()=>run(async()=>{const {error}=await db.from('memos').delete().eq('id',row.id).eq('user_id',user.id);if(error)throw error;await list();message('삭제했습니다.')},'삭제 중…');li.append(p,b);$('list').append(li)}
 if(!data.length){const li=document.createElement('li');li.textContent='저장된 메모가 없습니다.';$('list').append(li)}
}
async function render(session){user=session?.user||null;generation++;$('auth').hidden=!!user;$('memo').hidden=!user;$('list').replaceChildren();$('account').textContent=user?.email||'';if(user)await list()}
async function login(signup){if(!$('authForm').reportValidity())return;await run(async()=>{
 const credentials={email:$('email').value.trim(),password:$('password').value};
 const {data,error}=signup?await db.auth.signUp(credentials):await db.auth.signInWithPassword(credentials);
 if(error)throw error;if(!data.session)throw new Error('자동 로그인되지 않았습니다. 이메일 확인 설정을 확인해 주세요.');
 $('password').value='';await render(data.session);message(signup?'가입하고 로그인했습니다.':'로그인했습니다.');
},signup?'가입 중…':'로그인 중…')}
$('authForm').onsubmit=e=>{e.preventDefault();login(false)};$('signup').onclick=()=>login(true);
$('memoForm').onsubmit=e=>{e.preventDefault();const content=$('content').value.trim();if(!content){message('메모 내용을 입력해 주세요.');return}run(async()=>{if(!user)throw new Error('로그인해 주세요.');const {error}=await db.from('memos').insert({user_id:user.id,content});if(error)throw error;$('content').value='';await list();message('저장했습니다.')},'저장 중…')};
$('logout').onclick=()=>run(async()=>{const {error}=await db.auth.signOut();if(error)throw error;await render(null);message('로그아웃했습니다.')},'로그아웃 중…');
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){generation++;user=null;$('auth').hidden=false;$('memo').hidden=true;$('list').replaceChildren()}});
try{const {data,error}=await db.auth.getSession();if(error)throw error;await render(data.session);message('')}catch(e){$('auth').hidden=false;message('오류: '+e.message)}
</script></body></html>
